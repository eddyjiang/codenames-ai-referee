name: codenames-cv-service
region: nyc

services:
  - name: cv
    dockerfile_path: cv-service/Dockerfile
    source_dir: /
    github:
      repo: eddyjiang/codenames-ai-referee
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-m   # 1 vCPU / 2 GB RAM — EasyOCR needs ~1.2 GB at runtime
    instance_count: 1
    http_port: 8000
    health_check:
      http_path: /health
      initial_delay_seconds: 60   # allow time for uvicorn startup
      period_seconds: 30
    envs:
      - key: API_SECRET
        scope: RUN_TIME
        type: SECRET                # set value in DO dashboard, never in this file
